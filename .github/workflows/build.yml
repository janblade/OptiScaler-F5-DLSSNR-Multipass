# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Scheduled Build

on:
  schedule:
    - cron: '0 4 * * *' 

  workflow_dispatch:
#  push:
#    branches: [ "master" ]
#  pull_request:
#    branches: [ "master" ]
    
env:
  # Path to the solution file relative to the root of the project.
  SOLUTION_FILE_PATH: .

  # Configuration type to build.
  # You can convert this to a build matrix if you need coverage of multiple configuration types.
  # https://docs.github.com/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
  BUILD_CONFIGURATION: Release

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0            
        submodules: 'true'
        
    - name: Check Existing Release
      id: check_release
      uses: actions/github-script@v8
      with:
        script: |
          const releaseTag = "nightly";
          try {
            const release = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag: releaseTag,
            });
            core.setOutput("release_exists", true);
            core.setOutput("release_id", release.data.id);
            core.setOutput("upload_url", release.data.upload_url);
          } catch (error) {
            if (error.status === 404) {
              core.setOutput("release_exists", false);
            } else {
              throw error;
            }
          }

    - name: Create Nightly Release (if not exists)
      id: create_release
      if: steps.check_release.outputs.release_exists == 'false'
      uses: actions/github-script@v8
      with:
        script: |
          const release = await github.rest.repos.createRelease({
            owner: context.repo.owner,
            repo: context.repo.repo,
            tag_name: "nightly",
            name: "Nightly Builds",
            body: "This is an automated nightly build release.",
            draft: false,
            prerelease: true,
          });
          core.setOutput("release_id", release.data.id);
          core.setOutput("upload_url", release.data.upload_url);
       
    - name: Extract OptiScaler Version
      id: get_version
      working-directory: ${{ github.workspace }}
      shell: powershell
      run: |
        # Ensure the file exists before proceeding
        $resourceFile = ".\OptiScaler\resource.h"
        if (-Not (Test-Path $resourceFile)) {
            Write-Error "File not found: $resourceFile"
            exit 1
        }
        
        # Helper function to extract the first matching line for a version component
        function Get-Version-Component {
            param (
                [string]$pattern,
                [string]$replacement
            )
            # Use Select-String and take only the first match
            $line = Get-Content $resourceFile | Select-String -Pattern $pattern | Select-Object -First 1
            if ($line) {
                return ($line.Line -replace $replacement).Trim()
            } else {
                Write-Error "Pattern not found: $pattern"
                exit 1
            }
        }
        
        # This fork tracks its own release line in NR_RELEASE_*, separately from upstream's VER_*
        # fields (which this workflow used to read, so every nightly carried the same frozen
        # "v0.7.7" regardless of how much NR work had actually landed). NR_RELEASE_* is also what
        # package_release.ps1 checks a -Version string against below, so reading it here keeps
        # the two in agreement.
        $majorVersion = Get-Version-Component 'NR_RELEASE_MAJOR_VERSION' '#define NR_RELEASE_MAJOR_VERSION\s+'
        $minorVersion = Get-Version-Component 'NR_RELEASE_MINOR_VERSION' '#define NR_RELEASE_MINOR_VERSION\s+'
        $hotfixVersion = Get-Version-Component 'NR_RELEASE_HOTFIX_VERSION' '#define NR_RELEASE_HOTFIX_VERSION\s+'

        # Get the current date in a specific format (e.g., YYYYMMDD)
        $date = Get-Date -Format "yyyyMMdd"

        # The date is what makes each nightly unique; a build counter isn't, so it is dropped here
        # rather than carried over from upstream's VER_BUILD_NUMBER.
        $version = "v$majorVersion.$minorVersion.$hotfixVersion-nightly-$date"
        $outputFileName = "OptiScaler-DLSSNR-F5-${version}"
        
        # Output the generated filename
        Write-Output "Generated Filename: $outputFileName"
        
        # Write outputs to GITHUB_OUTPUT
        "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
        "filename=$outputFileName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
        
      continue-on-error: false
      
    - name: Debug Outputs
      run: |
        echo "Version: ${{ steps.get_version.outputs.version }}"
        echo "Filename: ${{ steps.get_version.outputs.filename }}"
        
    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Build
      working-directory: ${{env.GITHUB_WORKSPACE}}
      # Add additional options to the MSBuild command line here (like platform or verbosity level).
      # See https://docs.microsoft.com/visualstudio/msbuild/msbuild-command-line-reference
      run: msbuild /m /p:Configuration=${{env.BUILD_CONFIGURATION}} ${{env.SOLUTION_FILE_PATH}} /verbosity:minimal
      
    - name: Package via package_release.ps1
      # The Build step above already built both projects in OptiScaler.sln (OptiScaler and
      # dlssnr_forwarder), and the forwarder's own OutDir lands in the same shared x64\Release\a\
      # folder package_release.ps1 falls back to -- so -SkipBuild is correct here, not a shortcut
      # taken for speed. This is what gets the nightly the same file allowlist, forwarder-export
      # check, and ini safety checks every tagged F5 release gets, instead of a raw copy of the
      # build directory.
      shell: powershell
      run: |
        & .\package_release.ps1 -Version "${{ steps.get_version.outputs.version }}" -SkipBuild
        if ($LASTEXITCODE -ne 0 -and $null -ne $LASTEXITCODE) { exit $LASTEXITCODE }
      continue-on-error: false

    - uses: actions/upload-artifact@v7.0.0
      with:
        name: ${{ steps.get_version.outputs.filename }}
        path: ${{ github.workspace }}\release\*.zip
        compression-level: 0
        archive: false
        if-no-files-found: error

    - name: Remove Previous Artifacts
      # Restored: upstream disabled this (186c667a, "Keep artifacts from the previous days in
      # the nightly release"), which on this fork meant 18 builds and 966.7 MB accumulating
      # with zero downloads across any of them. Runs before the new asset uploads below, since
      # it deletes every existing asset on the release -- after the new upload would delete the
      # thing just uploaded too.
      if: steps.check_release.outputs.release_exists == 'true'
      uses: actions/github-script@v8
      with:
        script: |
          const releaseId = ${{ steps.check_release.outputs.release_id }};
          const assets = await github.rest.repos.listReleaseAssets({
            owner: context.repo.owner,
            repo: context.repo.repo,
            release_id: releaseId,
          });

          for (const asset of assets.data) {
            await github.rest.repos.deleteReleaseAsset({
              owner: context.repo.owner,
              repo: context.repo.repo,
              asset_id: asset.id,
            });
            console.log(`Deleted asset: ${asset.name}`);
          }

    - name: Upload Artifact to Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: nightly
        files: ${{ github.workspace }}/release/*.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            
    - name: Get Commit Messages From Last Day and Update the Release
      id: commit_messages
      working-directory: ${{ github.workspace }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      shell: powershell
      run: |
        Write-Output "Fetching commits from the last 24 hours..."

        # Get commit messages excluding .yml file commits
        $commits = git log --since="1 day ago" --pretty=format:"%h %s (%an)" --abbrev-commit --no-merges --first-parent
        
        $commits = $commits -split "`n"

        # If no commits are found, cancel the workflow
        if (-not $commits) {          
          Write-Output "No relevant commits in the last 24 hours. Cancelling workflow."

          $ReleaseTag = "nightly"
          Write-Output "Updating existing release: $ReleaseTag"
          gh release edit $ReleaseTag --notes "### Changes in the Last 24 Hours`n`nNo changes..."   
        }
        else {
          # Join commits into a newline-separated string
          $formattedCommits = $commits -join "`n"        
          Write-Output "Commits: $formattedCommits`n"
  
          # Generate release notes
          $releaseNotes = "### Changes in the Last 24 Hours`n`n$formattedCommits"
          
          $ReleaseTag = "nightly"
          Write-Output "Updating existing release: $ReleaseTag"
          gh release edit $ReleaseTag --notes "$ReleaseNotes"   
        }
        
      continue-on-error: false
        
