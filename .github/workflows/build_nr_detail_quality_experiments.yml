name: Build Superior Scaling port
on:
  push:
    branches: [codex/superior-scaling-port]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: superior-port-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false
      - name: Verify shader identity and ABI
        run: python tests/test_nr_superior_scaling.py
      - name: Recompile Superior shaders
        shell: powershell
        run: |
          ./tools/compile_nr_interpass.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/test_nr_superior_scaling.py
          exit $LASTEXITCODE
      - name: Fetch dependencies
        shell: powershell
        run: |
          git config --global core.longpaths true
          git submodule sync --recursive
          git submodule update --init --recursive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: microsoft/setup-msbuild@v2
      - name: Test gains, scheduling and PSO policy
        shell: powershell
        run: |
          $vs = & "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $vc = Join-Path $vs "VC/Auxiliary/Build/vcvars64.bat"
          New-Item -ItemType Directory -Force artifacts/validation | Out-Null
          foreach ($name in @("superior_policy", "interpass_policy")) {
            cmd /c "`"$vc`" && cl /nologo /std:c++17 /EHsc /O2 tests/nr_gpu/$name.cpp /Fe:artifacts/validation/$name.exe /Fo:artifacts/validation/$name.obj"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & "artifacts/validation/$name.exe"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Build Release DLL
        shell: powershell
        run: |
          msbuild OptiScaler.sln /m /p:Configuration=Release /p:Platform=x64 /verbosity:minimal /fl /flp:logfile=superior-build.log
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Superior-Scaling-port-${{ github.sha }}
          path: |
            x64/Release/OptiScaler.dll
            x64/Release/a/**
            superior-build.log
          if-no-files-found: error
