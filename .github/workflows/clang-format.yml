name: clang-format Check
# Pull requests only: a PR has a clear base, a branch push does not (a new branch would be charged for its base's lines).
on: [pull_request, workflow_dispatch]
jobs:
  formatting-check:
    name: Formatting Check
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install the pinned clang-format
      run: python -m pip install -r tools/requirements-format.txt
    # Only the lines this PR changes are checked; files in .clang-format-ignore are skipped. Same check locally:
    # python tools/format_check.py --base origin/<target branch>
    - name: Check the changed lines
      run: |
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          # The checkout is the PR merged into its base, so its first parent is the base.
          python tools/format_check.py --base HEAD^1 --head HEAD
        else
          python tools/format_check.py --base "$(git merge-base origin/main HEAD)" --head HEAD
        fi
